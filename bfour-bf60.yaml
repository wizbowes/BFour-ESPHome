esphome:
  name: bfour-bf60
  friendly_name: BFour BF-60

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  logs:
    bfour: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "BFour Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

globals:
  - id: probe_black_temp
    type: float
    initial_value: 'NAN'
  - id: probe_white_temp
    type: float
    initial_value: 'NAN'

interval:
  - interval: 4min
    then:
      - if:
          condition:
            lambda: 'return id(bfour).connected();'
          then:
            - ble_client.ble_write:
                id: bfour
                service_uuid: "FFB0"
                characteristic_uuid: "FFB1"
                value: [0x55, 0x04, 0x00]

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bfour_mac
    id: bfour
    on_connect:
      then:
        - if:
            condition:
              lambda: 'return id(use_celsius).state;'
            then:
              - ble_client.ble_write:
                  id: bfour
                  service_uuid: "FFB0"
                  characteristic_uuid: "FFB1"
                  value: [0x55, 0x01, 0x01]
            else:
              - ble_client.ble_write:
                  id: bfour
                  service_uuid: "FFB0"
                  characteristic_uuid: "FFB1"
                  value: [0x55, 0x01, 0x00]
        - logger.log: "Connected to BFour BF-60"
    on_disconnect:
      then:
        - lambda: |-
            id(probe_black_alarm_sensor).publish_state(false);
            id(probe_white_alarm_sensor).publish_state(false);
        - logger.log: "Disconnected - will retry"

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: bfour
    name: "BFour Raw"
    internal: true
    service_uuid: "FFB0"
    characteristic_uuid: "FFB2"
    notify: true
    lambda: |-
      if (x.size() < 6) return NAN;
      auto decode = [](uint8_t hi, uint8_t lo) -> float {
        uint16_t raw = (hi << 8) | lo;
        if (raw == 0 || raw == 0xFFFF) return NAN;
        return raw / 10.0f;
      };
      float black = decode(x[2], x[3]);
      float white = decode(x[4], x[5]);
      id(probe_black_temp) = black;
      id(probe_white_temp) = white;
      ESP_LOGI("bfour", "TEMP  Black=%.1f°C  White=%.1f°C", black, white);

      float bt = id(probe_black_target).state;
      if (!isnan(black) && bt > 0.5f) {
        bool fire = black >= bt;
        id(probe_black_alarm_sensor).publish_state(fire);
        if (fire) ESP_LOGW("bfour", "ALARM Black=%.1f >= %.1f", black, bt);
      }

      float wt = id(probe_white_target).state;
      if (!isnan(white) && wt > 0.5f) {
        bool fire = white >= wt;
        id(probe_white_alarm_sensor).publish_state(fire);
        if (fire) ESP_LOGW("bfour", "ALARM White=%.1f >= %.1f", white, wt);
      }
      return NAN;

  - platform: ble_client
    type: rssi
    ble_client_id: bfour
    name: "BFour Signal"
    unit_of_measurement: "dBm"
    update_interval: 10s

  - platform: template
    name: "Probe - Black"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    lambda: "return id(probe_black_temp);"

  - platform: template
    name: "Probe - White"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    lambda: "return id(probe_white_temp);"

binary_sensor:
  - platform: template
    name: "Probe Black Alarm"
    id: probe_black_alarm_sensor
    device_class: heat

  - platform: template
    name: "Probe White Alarm"
    id: probe_white_alarm_sensor
    device_class: heat

number:
  - platform: template
    name: "Probe Black Target"
    id: probe_black_target
    min_value: 1
    max_value: 99
    step: 1
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    set_action:
      - ble_client.ble_write:
          id: bfour
          service_uuid: "FFB0"
          characteristic_uuid: "FFB1"
          value: !lambda |-
            int val = (int)x;
            return {0x55, 0x02, 0x01,
                    (uint8_t)(val >> 8), (uint8_t)(val & 0xFF)};

  - platform: template
    name: "Probe White Target"
    id: probe_white_target
    min_value: 1
    max_value: 99
    step: 1
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    set_action:
      - ble_client.ble_write:
          id: bfour
          service_uuid: "FFB0"
          characteristic_uuid: "FFB1"
          value: !lambda |-
            int val = (int)x;
            return {0x55, 0x02, 0x02,
                    (uint8_t)(val >> 8), (uint8_t)(val & 0xFF)};

# ── °C / °F toggle ───────────────────────────────────────────────────────
# [0x55, 0x01, 0x01] = Celsius, [0x55, 0x01, 0x00] = Fahrenheit
# [0x55, 0x0f, 0x01/0x00] = alarm mute on/off

switch:
  - platform: template
    name: "Display Celsius"
    id: use_celsius
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - ble_client.ble_write:
          id: bfour
          service_uuid: "FFB0"
          characteristic_uuid: "FFB1"
          value: [0x55, 0x01, 0x01]
    turn_off_action:
      - ble_client.ble_write:
          id: bfour
          service_uuid: "FFB0"
          characteristic_uuid: "FFB1"
          value: [0x55, 0x01, 0x00]

  - platform: template
    name: "Alarm Sound"
    id: alarm_sound_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - ble_client.ble_write:
          id: bfour
          service_uuid: "FFB0"
          characteristic_uuid: "FFB1"
          value: [0x55, 0x0f, 0x01]
    turn_off_action:
      - ble_client.ble_write:
          id: bfour
          service_uuid: "FFB0"
          characteristic_uuid: "FFB1"
          value: [0x55, 0x0f, 0x00]
